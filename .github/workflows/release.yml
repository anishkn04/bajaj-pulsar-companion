name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to release (e.g. v0.1.0)'
                required: true
                default: ''

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-and-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  api-level: 36

            - name: Install build-tools 36.0.0
              run: |
                  "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" || true
                  yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

            - name: Run unit tests and debug build
              run: ./gradlew test :app:assembleDebug

            - name: Run lint
              run: ./gradlew :app:lintDebug

    build-release:
        needs: test-and-lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            apk: ${{ steps.artifacts.outputs.apk }}
            aab: ${{ steps.artifacts.outputs.aab }}
            tag: ${{ steps.tag.outputs.tag }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Resolve release tag
              id: tag
              run: |
                  TAG="${{ github.event.inputs.tag }}"
                  if [[ -z "$TAG" ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  api-level: 36

            - name: Install build-tools 36.0.0
              run: |
                  "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" || true
                  yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

            - name: Install release keystore from secret
              run: |
                  echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > app/release-keystore.jks
                  chmod 600 app/release-keystore.jks

            - name: Write signing properties (not committed)
              run: |
                  cat > keystore.properties <<EOF
                  keystore.path=app/release-keystore.jks
                  keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
                  key.alias=${{ secrets.KEY_ALIAS }}
                  key.password=${{ secrets.KEY_PASSWORD }}
                  EOF
                  chmod 600 keystore.properties

            - name: Build release APK and AAB
              run: |
                  ./gradlew :app:assembleRelease :app:bundleRelease

            - name: Locate build artifacts
              id: artifacts
              run: |
                  APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
                  AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)
                  echo "apk=$APK" >> "$GITHUB_OUTPUT"
                  echo "aab=$AAB" >> "$GITHUB_OUTPUT"

            - name: Upload release artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-artifacts-${{ steps.tag.outputs.tag }}
                  path: |
                      ${{ steps.artifacts.outputs.apk }}
                      ${{ steps.artifacts.outputs.aab }}
                  retention-days: 7

    create-github-release:
        needs: build-release
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ needs.build-release.outputs.tag }}

            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  name: release-artifacts-${{ needs.build-release.outputs.tag }}
                  path: release-artifacts

            - name: Generate changelog
              id: changelog
              run: |
                  chmod +x .github/scripts/generate-changelog.sh
                  .github/scripts/generate-changelog.sh "${{ needs.build-release.outputs.tag }}" > changelog.md
                  cat changelog.md

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  APK=$(find release-artifacts -name '*.apk' | head -n1)
                  AAB=$(find release-artifacts -name '*.aab' | head -n1)
                  gh release create "${{ needs.build-release.outputs.tag }}" \
                      --title "${{ needs.build-release.outputs.tag }}" \
                      --notes-file changelog.md \
                      "$APK" "$AAB"
